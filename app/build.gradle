apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdk = 37

    defaultConfig {
        applicationId = "se.whitchurch.nordict"
        minSdk = 28
        targetSdk = 33
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt')
        }
    }

    buildFeatures {
        viewBinding = true
        compose = true
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs += [
                    '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.util=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.io=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.text=ALL-UNNAMED',
                    '--add-opens', 'java.desktop/java.awt.font=ALL-UNNAMED',
                    '--add-opens', 'java.base/jdk.internal.reflect=ALL-UNNAMED'
            ]
        }
    }

    compileOptions {
        sourceCompatibility = 11
        targetCompatibility = 11
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
        }
    }
    namespace = 'se.whitchurch.nordict'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${rootProject.ext["kotlin_version"]}"
    implementation 'androidx.appcompat:appcompat:1.0.2'
    // Pinned: lint's InvalidFragmentVersionForActivityResult requires
    // fragment >= 1.3.0 for registerForActivityResult; appcompat 1.0.2 only
    // brings 1.1.0 on the compile classpath.
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.webkit:webkit:1.4.0'
    implementation "org.jsoup:jsoup:1.12.1"
    implementation 'com.github.ankidroid:Anki-Android:v2.17alpha8'
    implementation 'com.squareup.retrofit2:retrofit:2.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.0.1'
    implementation "com.squareup.okhttp3:okhttp:4.9.1"
    implementation 'androidx.test.espresso:espresso-idling-resource:3.7.0'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.2.0'
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation 'com.vanniktech:android-image-cropper:4.6.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'

    // Compose
    implementation 'androidx.compose.ui:ui:1.12.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.12.1'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha28'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.foundation:foundation:1.12.1'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.navigation:navigation-compose:2.10.1'
    implementation 'androidx.navigationevent:navigationevent-compose:1.1.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.12.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.12.1'

    // Test dependencies
    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.test:core:1.7.0"
    testImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "androidx.test.espresso:espresso-core:3.6.1"
    testImplementation "androidx.compose.ui:ui-test-junit4:1.12.1"
    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "com.google.truth:truth:1.4.0"
    testImplementation "com.squareup.okhttp3:okhttp:4.9.1"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.9.1"
    testImplementation "org.mockito:mockito-core:5.21.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:6.2.3"
    testImplementation "io.mockk:mockk:1.14.9"

    // Android Test dependencies
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-idling-resource:3.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.12.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
