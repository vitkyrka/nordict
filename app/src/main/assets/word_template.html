<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=0.25">
    <link id="main-css" rel='stylesheet' type='text/css' href='renderer.css'>
    <script id="jq-js" src='jquery.min.js'></script>
    <script id="renderer-js" src='renderer.js'></script>
    <script id="word-js" src='word.js'></script>
    <script>
        function loadWord(wordData) {
            $(document).ready(() => {
                if (typeof renderWord === 'function') {
                    renderWord(wordData);
                }
                if (typeof createLinks === 'function') {
                    createLinks(document.getElementById('content'));
                }
            });
        }
    </script>
</head>
<body>
    <div id="content"></div>
</body>
</html>
