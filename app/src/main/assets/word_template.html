<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="main-css" rel='stylesheet' type='text/css' href='renderer.css'>
    <script id="renderer-js" src='renderer.js'></script>
    <script id="word-js" src='word.js'></script>
    <script>
        function loadWord(wordData) {
            const render = () => {
                if (typeof renderWord === 'function') {
                    renderWord(wordData);
                }
                if (typeof createLinks === 'function') {
                    createLinks(document.getElementById('content'));
                }
            };
            if (document.readyState !== 'loading') {
                render();
            } else {
                document.addEventListener('DOMContentLoaded', render);
            }
        }
        // Card-back capture (see CardBackRenderer): renders the synthetic
        // card word with renderCardWord and deliberately skips word.js
        // auto-linking — /search/ links are dead inside Anki.
        function loadCard(wordData) {
            const render = () => {
                if (typeof renderCardWord === 'function') {
                    renderCardWord(wordData);
                }
            };
            if (document.readyState !== 'loading') {
                render();
            } else {
                document.addEventListener('DOMContentLoaded', render);
            }
        }
    </script>
</head>
<body>
    <div id="content"></div>
</body>
</html>
